<!DOCTYPE html>
<html lang="tr">

<head>
    <meta charset="UTF-8">
    <title>HGM ATLAS Test</title>

    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />

    <style>
        html,
        body {
            margin: 0;
            width: 100%;
            height: 100%;
        }

        #map {
            width: 100%;
            height: 100%;
        }
    </style>
</head>

<body>

    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

    <script src="https://api.harita.gov.tr/atlas-js/v1.0.0/atlas.js"></script>

    <script>

        const client = new atlas.Client({
            apiKey: "BURAYA_KENDI_API_KEYIN",
            mapType: atlas.MAPTYPES.LEAFLET
        });

        const layers = client.createLayer(
            atlas.BASEMAPS.UYDU
        );

        const map = L.map("map", {
            layers: layers
        }).setView(
            [41.26035, 36.32905],
            15
        );

    </script>

</body>

</html>
